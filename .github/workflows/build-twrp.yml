name: Build TWRP for Xiaomi 14T Pro (rothko)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: TWRP Manifest Branch
        options:
          - '14.1'
        required: true
        default: '14.1'
      BUILD_TARGET:
        type: choice
        description: Build Target Partition
        options:
          - vendor_boot
          - boot
          - recovery
        required: true
        default: vendor_boot

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      DEVICE_TREE_URL: https://github.com/JonesqPacMan/android_device_xiaomi_rothko_twrp
      DEVICE_TREE_BRANCH: twrp-14.1_a16
      DEVICE_PATH: device/xiaomi/rothko
      DEVICE_NAME: rothko
      DEVICE_MAKEFILE: twrp_rothko

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Display Build Parameters
        run: |
          echo "::group::Build Configuration"
          echo "Manifest Branch: twrp-${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ env.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ env.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ env.DEVICE_PATH }}"
          echo "Device Name: ${{ env.DEVICE_NAME }}"
          echo "Build Target: ${{ inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Validate Manifest Compatibility
        run: |
          if [[ "${{ inputs.MANIFEST_BRANCH }}" != "14.1" ]]; then
            echo "This workflow currently supports MANIFEST_BRANCH=14.1 only."
            exit 1
          fi

      - name: Free Disk Space
        run: |
          echo "::group::Disk space BEFORE cleanup"
          df -h /
          echo "::endgroup::"

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/microsoft || true
          sudo rm -rf /opt/google || true
          sudo rm -rf /opt/az || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/az_* || true

          sudo docker image prune --all --force || true
          sudo docker builder prune -af || true

          echo "::group::Disk space AFTER cleanup"
          df -h /
          echo "::endgroup::"

      - name: Cleanup Workspace
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Prepare Build Environment
        run: |
          sudo add-apt-repository -y universe
          sudo apt update
          sudo apt -y install \
            gperf gcc-multilib gcc-12-multilib g++-multilib g++-12-multilib \
            libc6-dev x11proto-core-dev libx11-dev tree \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static \
            libstdc++-12-dev python3 python-is-python3 zip unzip \
            bison build-essential curl flex git gnupg rsync zlib1g-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize TWRP Manifest
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-${{ inputs.MANIFEST_BRANCH }}

      - name: Repo Sync
        working-directory: workspace
        run: |
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --current-branch --optimized-fetch

      - name: Clone Device Tree
        working-directory: workspace
        run: |
          git clone ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}

      - name: Patch Lunch Combo to Android 14 Format
        working-directory: workspace
        run: |
          if grep -q 'COMMON_LUNCH_CHOICES' "${{ env.DEVICE_PATH }}/AndroidProducts.mk"; then
            sed -i 's/twrp_rothko-user/twrp_rothko-ap2a-user/g' "${{ env.DEVICE_PATH }}/AndroidProducts.mk"
            sed -i 's/twrp_rothko-userdebug/twrp_rothko-ap2a-userdebug/g' "${{ env.DEVICE_PATH }}/AndroidProducts.mk"
            sed -i 's/twrp_rothko-eng/twrp_rothko-ap2a-eng/g' "${{ env.DEVICE_PATH }}/AndroidProducts.mk"
          fi


      - name: Sync Extra Dependencies from twrp.dependencies
        working-directory: workspace
        run: |
          DEPS_FILE="${{ env.DEVICE_PATH }}/twrp.dependencies"
          if [ ! -f "$DEPS_FILE" ]; then
            echo "No twrp.dependencies found, skipping extra dependency sync"
            exit 0
          fi

          DEPS_FILE="$DEPS_FILE" python3 - <<'PY2'
import json, os, subprocess
from pathlib import Path

deps_file = Path(os.environ['DEPS_FILE'])
workspace = Path.cwd()
with deps_file.open() as f:
    deps = json.load(f)

if not isinstance(deps, list):
    raise RuntimeError(f"Expected a list in {deps_file}, got {type(deps).__name__}")

for dep in deps:
    if not isinstance(dep, dict):
        continue
    repo = dep.get('repository')
    target = dep.get('target_path')
    branch = dep.get('branch') or os.environ.get('DEVICE_TREE_BRANCH', 'master')
    if not repo or not target:
        print(f"[skip] invalid dependency entry: {dep}")
        continue

    dest = workspace / target
    if dest.exists():
        print(f"[skip] {target} already exists")
        continue

    dest.parent.mkdir(parents=True, exist_ok=True)
    if repo.startswith(('https://', 'http://', 'ssh://', 'git@')):
        url = repo
    else:
        url = f"https://github.com/{repo}"

    print(f"[clone] {url} -b {branch} -> {target}")
    subprocess.check_call(['git', 'clone', '--depth=1', '-b', branch, url, str(dest)])
PY2

      - name: Verify Device Product Definition
        working-directory: workspace
        run: |
          test -f "${{ env.DEVICE_PATH }}/AndroidProducts.mk"
          grep -E "twrp_rothko-ap2a-(eng|userdebug|user)" "${{ env.DEVICE_PATH }}/AndroidProducts.mk"

      - name: Sync Device Dependencies
        working-directory: workspace
        continue-on-error: true
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ env.DEVICE_MAKEFILE }}-ap2a-eng

      - name: Build TWRP Recovery
        working-directory: workspace
        run: |
          set -o pipefail
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ env.DEVICE_MAKEFILE }}-ap2a-eng
          make $(tr -d _ <<< ${{ inputs.BUILD_TARGET }})image -j$(nproc --all) 2>&1 | tee build_log.txt

      - name: Validate Output Image
        working-directory: workspace
        run: |
          IMG="out/target/product/${{ env.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img"
          if [ ! -f "$IMG" ]; then
            echo "Missing output image: $IMG"
            exit 1
          fi
          SIZE=$(stat -c%s "$IMG")
          echo "Output size: $SIZE bytes"
          if [ "$SIZE" -lt 10485760 ]; then
            echo "Image too small; likely invalid build artifact"
            exit 1
          fi

      - name: List Output Files
        if: always()
        working-directory: workspace
        run: |
          find out/target/product/${{ env.DEVICE_NAME }}/ -maxdepth 1 \( -name "*.img" -o -name "*.zip" \)

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: workspace/build_log.txt
          retention-days: 7

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
            workspace/out/target/product/${{ env.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
            workspace/out/target/product/${{ env.DEVICE_NAME }}/ramdisk-recovery.*
          name: TWRP-${{ env.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            ## TWRP Recovery for Xiaomi 14T Pro (rothko)

            **Build Info:**
            - Manifest Branch: twrp-${{ inputs.MANIFEST_BRANCH }}
            - Device Tree: ${{ env.DEVICE_TREE_URL }}
            - Device Tree Branch: ${{ env.DEVICE_TREE_BRANCH }}
            - Build Target: ${{ inputs.BUILD_TARGET }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
